name: TJAR SNS Tracker Auto Fetch

on:
  schedule:
    # 毎時 0, 15, 30, 45 分に実行 (UTC表記)
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write

jobs:
  build-and-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Run SNS fetch script
        run: python scripts/fetch_sns.py

      - name: Commit and push updated feed.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update SNS feed"
            git push
          else
            echo "No changes in feed.json to commit."
          fi
